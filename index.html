<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="@jeanrafaellourenco portfolio — Cybersecurity Analyst, Web Application Tester, CTF Player, Red Team Operator, OSINT.">
  <meta name="keywords" content="Cybersecurity Analyst, Web Application Tester, CTF Player, Python and Bash Script Developer">
  <meta name="author" content="Jean Rafael Lourenço">
  <title>Jean Rafael Lourenço — Cybersecurity Analyst</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-background: #000000;
      --color-surface: #0d0d0d;
      --color-card: #0c130e;
      --color-primary: #00ff41;
      --color-on-primary: #0f172a;
      --color-accent: #ff3333;
      --color-cyan: #00ffff;
      --color-foreground: #e0e0e0;
      --color-muted: #94a3b8;
      --color-border: #1f1f1f;
      --color-border-neon: rgba(0, 255, 65, 0.35);
      --font-display: "Orbitron", sans-serif;
      --font-mono: "JetBrains Mono", monospace;
      --glow-sm: 0 0 8px rgba(0, 255, 65, 0.55);
      --glow-md: 0 0 16px rgba(0, 255, 65, 0.45), 0 0 40px rgba(0, 255, 65, 0.2);
      --nav-height: 4.25rem;
      --radius: 2px;
      --transition: 200ms ease;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background: var(--color-background);
    }

    body {
      background: var(--color-background);
      color: var(--color-foreground);
      font-family: var(--font-mono);
      font-size: 1rem;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    img, svg { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }

    :focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 3px;
    }

    .container {
      width: min(100% - 2.5rem, 64rem);
      margin-inline: auto;
    }

    /* ── Matrix rain ───────────────────────────────────── */
    #matrix {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.3;
      pointer-events: none;
    }

    /* ── Scanlines ─────────────────────────────────────── */
    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 2px,
        rgba(0, 0, 0, 0.18) 3px,
        transparent 4px
      );
      opacity: 0.5;
    }

    /* ── Nav ───────────────────────────────────────────── */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: var(--nav-height);
      background: rgba(0, 0, 0, 0.85);
      border-bottom: 1px solid var(--color-border);
      backdrop-filter: blur(8px);
    }

    .nav__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100%;
    }

    .nav__logo {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-family: var(--font-display);
      font-weight: 900;
      letter-spacing: 0.08em;
      color: var(--color-primary);
      text-shadow: var(--glow-sm);
      cursor: pointer;
      transition: text-shadow var(--transition);
    }

    .nav__logo:hover { text-shadow: var(--glow-md); }

    .nav__social {
      display: flex;
      gap: 0.6rem;
    }

    .nav__social-link {
      display: grid;
      place-items: center;
      width: 2.35rem;
      height: 2.35rem;
      color: var(--color-muted);
      border: 1px solid var(--color-border);
      background: var(--color-card);
      transition: color var(--transition), border-color var(--transition), box-shadow var(--transition), transform var(--transition);
      cursor: pointer;
    }

    .nav__social-link svg {
      width: 1.05rem;
      height: 1.05rem;
    }

    .nav__social-link:hover {
      color: var(--color-primary);
      border-color: var(--color-border-neon);
      box-shadow: var(--glow-sm);
      transform: translateY(-2px);
    }

    /* ── Buttons (NullByte HUD) ────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.6rem 1.2rem;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border: 1px solid transparent;
      border-radius: var(--radius);
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition), color var(--transition), border-color var(--transition);
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    }

    .btn--primary {
      background: var(--color-primary);
      color: var(--color-on-primary);
      box-shadow: var(--glow-sm);
    }

    .btn--primary:hover {
      transform: translateY(-2px);
      box-shadow: var(--glow-md);
      background: #4dff7a;
    }

    .btn--primary:active { transform: translateY(0); }

    .btn--ghost {
      background: transparent;
      color: var(--color-primary);
      border-color: var(--color-border-neon);
    }

    .btn--ghost:hover {
      background: rgba(0, 255, 65, 0.08);
      box-shadow: var(--glow-sm);
      transform: translateY(-2px);
    }

    .icon {
      width: 1.15em;
      height: 1.15em;
      flex-shrink: 0;
    }

    /* ── Hero (NullByte pattern) ───────────────────────── */
    .hero {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      flex: 1;
      padding: calc(var(--nav-height) + 1.5rem) 0 1.5rem;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0, 255, 65, 0.09), transparent);
    }

    .hero__grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 255, 65, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 65, 0.05) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, black 40%, transparent 95%);
      pointer-events: none;
    }

    .hero__inner {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .hero__avatar-wrap {
      position: relative;
      margin-bottom: 0.85rem;
    }

    .hero__avatar-wrap::before {
      content: "";
      position: absolute;
      left: -8px;
      right: -8px;
      top: 6%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--color-primary), transparent);
      box-shadow: var(--glow-sm);
      animation: sweep 3.2s ease-in-out infinite;
      pointer-events: none;
      z-index: 1;
    }

    .hero__avatar {
      width: clamp(6.5rem, 14vw, 8rem);
      height: clamp(6.5rem, 14vw, 8rem);
      border-radius: 50%;
      border: 2px solid var(--color-primary);
      box-shadow: var(--glow-md);
      object-fit: cover;
      background: var(--color-surface);
    }

    .hero__avatar-wrap::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1px dashed var(--color-border-neon);
      animation: spin 24s linear infinite;
      pointer-events: none;
    }

    .blink {
      color: var(--color-primary);
      animation: blink 1.1s steps(2, start) infinite;
    }

    .hero__title {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 5vw, 2.4rem);
      font-weight: 900;
      letter-spacing: 0.05em;
      line-height: 1.1;
      color: var(--color-foreground);
      text-shadow: var(--glow-md);
    }

    .hero__title .text-green {
      color: var(--color-primary);
      text-shadow: var(--glow-md);
    }

    /* ── Glitch (whoami original) ──────────────────────── */
    .glitch {
      position: relative;
      display: inline-block;
    }

    .glitch::before,
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      pointer-events: none;
    }

    .glitch::before {
      left: 2px;
      text-shadow: -2px 0 #49fc00;
      animation: glitch-anim 2.5s infinite linear alternate-reverse;
    }

    .glitch::after {
      left: -2px;
      text-shadow: -2px 0 #b300fc;
      animation: glitch-anim-2 3s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim {
      0% { clip: rect(136px, 9999px, 50px, 0); }
      50% { clip: rect(0px, 9999px, 12px, 0); }
      100% { clip: rect(49px, 9999px, 135px, 0); }
    }

    @keyframes glitch-anim-2 {
      0% { clip: rect(118px, 9999px, 37px, 0); }
      50% { clip: rect(12px, 9999px, 143px, 0); }
      100% { clip: rect(44px, 9999px, 148px, 0); }
    }

    .hero__subtitle {
      font-family: var(--font-mono);
      font-size: clamp(0.82rem, 2vw, 0.95rem);
      color: var(--color-primary);
      margin-top: 0.4rem;
      letter-spacing: 0.06em;
    }

    .hero__typing {
      min-height: 1.4rem;
      margin-bottom: 0.6rem;
      font-size: 0.85rem;
      color: var(--color-primary);
    }

    .hero__actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 1.25rem;
    }

    /* ── Player (terminal panel) ───────────────────────── */
    .player-section {
      position: relative;
      z-index: 1;
      padding: 0 0 3rem;
    }

    .player {
      max-width: 36rem;
      margin: 0.5rem auto 0;
      background: rgba(12, 19, 14, 0.92);
      border: 1px solid var(--color-border-neon);
      border-radius: var(--radius);
      box-shadow: var(--glow-sm);
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
    }

    .player__bar {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.6rem 0.9rem;
      border-bottom: 1px solid var(--color-border);
      background: rgba(0, 0, 0, 0.4);
    }

    .player__dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .player__dot--red { background: var(--color-accent); }
    .player__dot--yellow { background: #ffc333; }
    .player__dot--green { background: var(--color-primary); }

    .player__title {
      margin-left: auto;
      font-size: 0.7rem;
      color: var(--color-muted);
      letter-spacing: 0.08em;
    }

    .player__body {
      padding: 0.9rem 1.1rem 1.1rem;
    }

    .player__now {
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-cyan);
      margin-bottom: 0.4rem;
    }

    .player__track {
      font-family: var(--font-display);
      font-size: clamp(0.9rem, 2.5vw, 1.05rem);
      font-weight: 700;
      color: var(--color-foreground);
      min-height: 1.4em;
      margin-bottom: 1rem;
    }

    .player__track span {
      font-family: var(--font-mono);
      font-weight: 400;
      font-size: 0.85em;
      color: var(--color-muted);
    }

    .player__controls {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .player__btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.6rem;
      height: 2.6rem;
      flex-shrink: 0;
      background: rgba(0, 255, 65, 0.08);
      color: var(--color-primary);
      border: 1px solid var(--color-border-neon);
      cursor: pointer;
      transition: background var(--transition), box-shadow var(--transition), transform var(--transition);
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    }

    .player__btn:hover {
      background: rgba(0, 255, 65, 0.18);
      box-shadow: var(--glow-sm);
      transform: translateY(-2px);
    }

    .player__btn svg {
      width: 1rem;
      height: 1rem;
    }

    .player__btn--play {
      background: var(--color-primary);
      color: var(--color-on-primary);
    }

    .player__btn--play:hover { background: #4dff7a; }

    .player__progress {
      flex: 1;
      min-width: 6rem;
      height: 6px;
      background: var(--color-border);
      border: 1px solid var(--color-border-neon);
      appearance: none;
      cursor: pointer;
    }

    .player__progress::-webkit-slider-thumb {
      appearance: none;
      width: 12px;
      height: 16px;
      background: var(--color-primary);
      box-shadow: var(--glow-sm);
      cursor: pointer;
    }

    .player__progress::-moz-range-thumb {
      width: 12px;
      height: 16px;
      border: 0;
      border-radius: 0;
      background: var(--color-primary);
      box-shadow: var(--glow-sm);
      cursor: pointer;
    }

    .player__time {
      font-size: 0.72rem;
      color: var(--color-muted);
      min-width: 6.5rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* ── Footer ────────────────────────────────────────── */
    .footer {
      position: relative;
      z-index: 1;
      border-top: 1px solid var(--color-border);
      background: var(--color-surface);
      padding: 1.5rem 0;
      margin-top: auto;
    }

    .footer__inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
      text-align: center;
    }

    .footer__brand {
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--color-primary);
      text-shadow: var(--glow-sm);
    }

    .footer__copy {
      font-size: 0.72rem;
      color: var(--color-muted);
    }

    /* ── Keyframes ─────────────────────────────────────── */
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes sweep {
      0% { top: 6%; opacity: 0; }
      12% { opacity: 1; }
      88% { opacity: 1; }
      100% { top: 94%; opacity: 0; }
    }

    /* ── Responsive ────────────────────────────────────── */
    @media (max-width: 600px) {
      .hero__actions { flex-direction: column; align-items: stretch; width: 100%; max-width: 20rem; }
      .btn { width: 100%; }
      .player__time { display: none; }
    }

    /* ── Reduced motion ────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .scanlines, .blink, .hero__avatar-wrap::after,
      .hero__avatar-wrap::before,
      .glitch::before, .glitch::after { animation: none; }
      .glitch::before, .glitch::after { display: none; }
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>

  <script>
    (function () {
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      document.getElementById("year").textContent = String(new Date().getFullYear());

      // ── Matrix rain ──────────────────────────────────
      var canvas = document.getElementById("matrix");
      var ctx = canvas.getContext("2d");
      var glyphs = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ<>{}[]#$%&*";
      var fontSize = 14;
      var columns = [];
      var raf = null;
      var lastFrame = 0;

      function resizeMatrix() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        var colCount = Math.ceil(canvas.width / fontSize);
        columns = [];
        for (var i = 0; i < colCount; i++) {
          columns.push(Math.random() * -50);
        }
      }

      function drawMatrix(now) {
        if (now - lastFrame < 50) {
          raf = requestAnimationFrame(drawMatrix);
          return;
        }
        lastFrame = now;
        ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "rgba(0, 255, 65, 0.55)";
        ctx.font = fontSize + "px monospace";
        for (var i = 0; i < columns.length; i++) {
          var ch = glyphs.charAt(Math.floor(Math.random() * glyphs.length));
          ctx.fillText(ch, i * fontSize, columns[i] * fontSize);
          if (columns[i] * fontSize > canvas.height && Math.random() > 0.975) {
            columns[i] = 0;
          }
          columns[i]++;
        }
        raf = requestAnimationFrame(drawMatrix);
      }

      resizeMatrix();
      window.addEventListener("resize", resizeMatrix);

      if (!reduceMotion) {
        raf = requestAnimationFrame(drawMatrix);
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) {
            if (raf) cancelAnimationFrame(raf);
            raf = null;
          } else if (!raf) {
            raf = requestAnimationFrame(drawMatrix);
          }
        });
      } else {
        ctx.fillStyle = "rgba(0, 255, 65, 0.2)";
        ctx.font = fontSize + "px monospace";
        for (var i = 0; i < 220; i++) {
          ctx.fillText(
            glyphs.charAt(Math.floor(Math.random() * glyphs.length)),
            Math.random() * canvas.width,
            Math.random() * canvas.height
          );
        }
      }

      // ── Typing ────────────────────────────────────────
      var typedEl = document.getElementById("typed");
      var roles = [
        "Web Application Tester",
        "Automation Specialist",
        "Python & Bash Script Developer",
        "Ethical Hacker, Bug Hunter",
        "CTF Player",
        "Red Team Operator",
        "OSINT, Security Researcher"
      ];

      function typeText(text, speed) {
        return new Promise(function (resolve) {
          var i = 0;
          typedEl.textContent = "";
          (function tick() {
            if (i < text.length) {
              typedEl.textContent += text.charAt(i);
              i++;
              setTimeout(tick, speed);
            } else {
              resolve();
            }
          })();
        });
      }

      function eraseText() {
        return new Promise(function (resolve) {
          (function tick() {
            var cur = typedEl.textContent;
            if (cur.length > 0) {
              typedEl.textContent = cur.slice(0, -1);
              setTimeout(tick, 16);
            } else {
              resolve();
            }
          })();
        });
      }

      async function runTyping() {
        if (reduceMotion) {
          typedEl.textContent = roles[0];
          return;
        }
        var idx = 0;
        for (;;) {
          await typeText(roles[idx], 30);
          await new Promise(function (r) { setTimeout(r, 1800); });
          await eraseText();
          await new Promise(function (r) { setTimeout(r, 350); });
          idx = (idx + 1) % roles.length;
        }
      }
      runTyping();

      // ── Music player ──────────────────────────────────
      var audio = document.getElementById("audio");
      var playBtn = document.getElementById("play");
      var prevBtn = document.getElementById("prev");
      var nextBtn = document.getElementById("next");
      var trackEl = document.getElementById("track");
      var barEl = document.getElementById("bar");
      var timeEl = document.getElementById("time");

      var playlist = [
        { title: "Matrix", artist: "Antraz", src: "assets/music/Matrix-Antraz.mp3" },
        { title: "Nenhum Sistema Está a Salvo", artist: "Antraz", src: "assets/music/Nenhum%20Sistema%20Est%C3%A1%20a%20Salvo-Antraz.mp3" },
        { title: "Piratas Do Silício", artist: "Antraz", src: "assets/music/Piratas%20Do%20Silicio-Antraz.mp3" }
      ];

      var iconPlay = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>';
      var iconPause = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';

      var current = 0;
      var playing = false;

      function formatTime(sec) {
        if (!isFinite(sec)) return "0:00";
        var m = Math.floor(sec / 60);
        var s = Math.floor(sec % 60);
        return m + ":" + (s < 10 ? "0" : "") + s;
      }

      function loadTrack(index, autoplay) {
        current = (index + playlist.length) % playlist.length;
        audio.src = playlist[current].src;
        trackEl.innerHTML = playlist[current].title + " <span>— " + playlist[current].artist + "</span>";
        barEl.value = "0";
        if (autoplay) {
          audio.play().then(function () { setPlaying(true); }).catch(function () { setPlaying(false); });
        }
      }

      function setPlaying(state) {
        playing = state;
        playBtn.innerHTML = state ? iconPause : iconPlay;
        playBtn.setAttribute("aria-label", state ? "Pause" : "Play");
        playBtn.setAttribute("aria-pressed", String(state));
      }

      audio.volume = 0.5;
      loadTrack(Math.floor(Math.random() * playlist.length), false);

      playBtn.addEventListener("click", function () {
        if (playing) {
          audio.pause();
          setPlaying(false);
        } else {
          audio.play().then(function () { setPlaying(true); }).catch(function () { setPlaying(false); });
        }
      });

      prevBtn.addEventListener("click", function () { loadTrack(current - 1, playing); });
      nextBtn.addEventListener("click", function () { loadTrack(current + 1, playing); });

      audio.addEventListener("timeupdate", function () {
        if (audio.duration) {
          barEl.value = String((audio.currentTime / audio.duration) * 100);
          timeEl.textContent = formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
        }
      });

      audio.addEventListener("ended", function () { loadTrack(current + 1, true); });

      barEl.addEventListener("input", function () {
        if (audio.duration) {
          audio.currentTime = (Number(barEl.value) / 100) * audio.duration;
        }
      });
    })();
  </script>
</body>
</html>
