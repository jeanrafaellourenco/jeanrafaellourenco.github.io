<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="keywords" content="Cybersecurity Analyst, Web Application Tester, CTF Player, Python and Bash Script Developer.">
    <meta name="description" content="@jeanrafaellourenco portfolio.">
    <meta name="author" content="Jean Rafael Lourenço">
    <title>Whoami</title>
    <link rel="icon" href="../assets/images/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kelly+Slab&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            background-color: black;
            color: white;
            font-family: 'Kelly Slab', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            padding: 40px 20px 80px 20px;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            z-index: 1;
            padding-bottom: 20px;
        }

        .logo {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: block;
        }

        .glitch {
            font-size: 32px;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
            margin: 10px 0;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
        }

        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 #49FC00;
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 #b300fc;
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(136px, 9999px, 50px, 0); }
            50% { clip: rect(0px, 9999px, 12px, 0); }
            100% { clip: rect(49px, 9999px, 135px, 0); }
        }

        @keyframes glitch-anim-2 {
            0% { clip: rect(118px, 9999px, 37px, 0); }
            50% { clip: rect(12px, 9999px, 143px, 0); }
            100% { clip: rect(44px, 9999px, 148px, 0); }
        }

        .subtitle {
            font-size: 16px;
            margin: 10px 0 20px;
            color: #49FC00;
        }

        .typing-container {
            width: 100%;
            margin: 20px 0;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .typing-container img {
            max-width: 100%;
            height: auto;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            margin-top: 20px;
        }

        .link-button {
            background: rgba(73, 252, 0, 0.1);
            border: 2px solid #49FC00;
            color: white;
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            font-weight: bold;
            padding: 15px 20px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .link-button:hover {
            background: rgba(73, 252, 0, 0.2);
            transform: translateY(-2px);
        }

        .link-button i {
            font-size: 18px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .social-links a {
            color: #49FC00;
            font-size: 24px;
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            color: white;
            transform: scale(1.2);
        }

        audio {
            display: none;
        }

        /* Desktop view */
        @media screen and (min-width: 769px) {
            .logo {
                width: 250px;
                height: 250px;
            }

            .glitch {
                font-size: 45px;
            }

            .subtitle {
                font-size: 20px;
            }

            .link-button {
                font-size: 16px;
                padding: 18px 25px;
            }
        }

        /* Mobile Linktree style */
        @media screen and (max-width: 768px) {
            body {
                justify-content: center;
                padding: 20px 15px 60px 15px;
            }

            .container {
                padding-bottom: 0;
            }

            .logo {
                width: 150px;
                height: 150px;
                margin-bottom: 15px;
            }

            .glitch {
                font-size: 24px;
            }

            .subtitle {
                font-size: 14px;
                margin: 8px 0 15px;
            }

            .typing-container {
                margin: 15px 0;
            }

            .links-container {
                gap: 12px;
                margin-top: 15px;
            }

            .link-button {
                font-size: 13px;
                padding: 14px 18px;
                border-radius: 8px;
            }

            .link-button i {
                font-size: 16px;
            }

            .social-links {
                margin-top: 25px;
                gap: 15px;
            }

            .social-links a {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    
    <div class="container">
        <img class="logo" src="../assets/images/profile-glitch.gif" alt="Jean Rafael Lourenço">
        
        <div class="glitch" data-text="Jean Rafael Lourenço">
            <font color="#49FC00">Jean</font> Rafael Lourenço
        </div>
        
        <p class="subtitle">&gt;"Cybersecurity Analyst"&lt;</p>
        
        <div class="typing-container">
            <img src="https://readme-typing-svg.demolab.com?font=&size=18&pause=1000&center=true&color=24F73A&width=600&lines=Web+Application+Tester;Automation+Specialist;Python+and+Bash+Script+Developer;Ethical+Hacker,+Bug+Hunter;CTF+Player;Offensive+Security;Red+Team+Operator;OSINT,+Security+Researcher" alt="Typing SVG" />
        </div>
        
        <div class="links-container">
            <button class="link-button" id="githubBtn">
                <i class="fa-brands fa-github"></i>
                GitHub
            </button>
            
            <button class="link-button" id="linkedinBtn">
                <i class="fa-brands fa-linkedin"></i>
                LinkedIn
            </button>
            
            <button class="link-button" id="siteBtn">
                <i class="fa-solid fa-globe"></i>
                Portfolio
            </button>
            
            <button class="link-button play-btn" id="playPause">
                <i class="fa-solid fa-music"></i>
                <span id="musicText">Play Music</span>
            </button>
        </div>
        
        <div class="social-links">
            <a href="https://github.com/jeanrafaellourenco" target="_blank" rel="noopener noreferrer" title="GitHub">
                <i class="fa-brands fa-github"></i>
            </a>
            <a href="https://www.linkedin.com/in/jeanrafaellourenco/" target="_blank" rel="noopener noreferrer" title="LinkedIn">
                <i class="fa-brands fa-linkedin"></i>
            </a>
            <a href="https://jeanrafaellourenco.github.io/" target="_blank" rel="noopener noreferrer" title="Site">
                <i class="fa-solid fa-globe"></i>
            </a>
        </div>
    </div>

    <audio id="audio">
        <source src="" type="audio/mpeg">
        Seu navegador não suporta áudio.
    </audio>

    <script>
        // Links dos botões
        document.getElementById('githubBtn').addEventListener('click', function() {
            window.open('https://github.com/jeanrafaellourenco', '_blank');
        });

        document.getElementById('linkedinBtn').addEventListener('click', function() {
            window.open('https://www.linkedin.com/in/jeanrafaellourenco/', '_blank');
        });

        document.getElementById('siteBtn').addEventListener('click', function() {
            window.open('https://jeanrafaellourenco.github.io/', '_blank');
        });

        // Player de música
        const songs = [
            { name: "Nenhum Sistema Está a Salvo", src: "../assets/music/Nenhum Sistema Está a Salvo-Antraz.mp3" },
            { name: "Piratas Do Silício", src: "../assets/music/Piratas Do Silicio-Antraz.mp3" },
            { name: "Matrix", src: "../assets/music/Matrix-Antraz.mp3" }
        ];

        const audio = document.getElementById("audio");
        audio.volume = 0.5;

        const playPauseButton = document.getElementById("playPause");
        const musicText = document.getElementById("musicText");
        let currentSong = null;
        let currentIndex = Math.floor(Math.random() * songs.length);

        musicText.textContent = songs[currentIndex].name;

        function playSong(song) {
            currentSong = song;
            audio.src = song.src;
            audio.play();
            musicText.textContent = "⏸ " + song.name;
        }

        audio.onended = () => {
            currentIndex = (currentIndex + 1) % songs.length;
            playSong(songs[currentIndex]);
        };

        playPauseButton.addEventListener("click", () => {
            if (!currentSong) {
                playSong(songs[currentIndex]);
            } else if (audio.paused) {
                audio.play();
                musicText.textContent = "⏸ " + currentSong.name;
            } else {
                audio.pause();
                musicText.textContent = "▶ " + currentSong.name;
            }
        });

        // Efeito Matrix
        const canvas = document.getElementById("matrixCanvas");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const fontSize = 16;
        const columns = Math.floor(canvas.width / fontSize);
        const drops = Array(columns).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "rgba(73, 252, 0, 0.2)";
            ctx.font = `${fontSize}px monospace`;

            for (let i = 0; i < drops.length; i++) {
                const text = Math.random() > 0.5 ? "0" : "1";
                const x = i * fontSize;
                const y = drops[i] * fontSize;

                ctx.fillText(text, x, y);

                if (y > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);

        window.addEventListener("resize", () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
